<!doctype html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Últimos datos</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #2563eb;
        --border: #e5e7eb;
        --track: #e5e7eb;
        --ok: #16a34a;
        --warn: #f59e0b;
        --bad: #dc2626;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .container {
        max-width: 980px;
        margin: 0 auto;
        padding: clamp(12px, 4vw, 24px);
      }
      .fecha {
        text-align: center;
        font-size: clamp(1.1rem, 4.5vw, 1.8rem);
        font-weight: 700;
        margin: 4px 0 2px;
      }
      .fecha-sub {
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
        margin-bottom: 18px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 14px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        text-align: center;
      }
      .title {
        font-size: 0.9rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 8px;
      }
      svg {
        width: 100%;
        height: auto;
        max-width: 300px;
        display: block;
        margin: 0 auto;
      }
      .gauge-value {
        font-size: 30px;
        font-weight: 700;
        fill: var(--text);
      }
      .gauge-limit {
        font-size: 12px;
        fill: var(--muted);
      }
      .arc {
        fill: none;
        stroke-width: 16;
        stroke-linecap: round;
      }
      .arc-track {
        stroke: var(--track);
      }
      .arc-fill {
        transition: stroke-dashoffset 0.6s, stroke 0.3s;
      }
      .batt-text {
        font-size: 1.6rem;
        font-weight: 700;
        margin-top: 8px;
      }
      .batt-sub {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .actions {
        text-align: center;
        margin-top: 18px;
      }
      .btn {
        border: 0;
        background: var(--primary);
        color: #fff;
        padding: 10px 18px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .status {
        margin-top: 10px;
        font-size: 0.85rem;
        color: var(--muted);
        text-align: center;
      }
      .error {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="fecha" class="fecha">—</div>
      <div class="fecha-sub">Fecha y hora de la última lectura</div>

      <div class="grid">
        <article class="card">
          <div class="title">Temperatura</div>
          <svg viewBox="0 0 200 125" role="img" aria-label="Temperatura">
            <path class="arc arc-track" d="M 20 100 A 80 80 0 0 1 180 100" pathLength="100" />
            <path id="g-temp" class="arc arc-fill" d="M 20 100 A 80 80 0 0 1 180 100" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" />
            <text id="t-temp" class="gauge-value" x="100" y="92" text-anchor="middle">—</text>
            <text class="gauge-limit" x="20" y="120" text-anchor="middle">15</text>
            <text class="gauge-limit" x="180" y="120" text-anchor="middle">25</text>
          </svg>
        </article>

        <article class="card">
          <div class="title">Humedad relativa</div>
          <svg viewBox="0 0 200 125" role="img" aria-label="Humedad relativa">
            <path class="arc arc-track" d="M 20 100 A 80 80 0 0 1 180 100" pathLength="100" />
            <path id="g-hum" class="arc arc-fill" d="M 20 100 A 80 80 0 0 1 180 100" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" />
            <text id="t-hum" class="gauge-value" x="100" y="92" text-anchor="middle">—</text>
            <text class="gauge-limit" x="20" y="120" text-anchor="middle">30</text>
            <text class="gauge-limit" x="180" y="120" text-anchor="middle">65</text>
          </svg>
        </article>

        <article class="card">
          <div class="title">Batería</div>
          <svg viewBox="0 0 120 60" role="img" aria-label="Batería">
            <rect x="4" y="8" width="100" height="44" rx="8" fill="none" stroke="#374151" stroke-width="4" />
            <rect x="106" y="22" width="8" height="16" rx="2" fill="#374151" />
            <rect id="batt-fill" x="10" y="14" width="0" height="32" rx="4" fill="#16a34a" />
          </svg>
          <div id="t-batt" class="batt-text">—</div>
          <div id="t-batt-pct" class="batt-sub">3.6 V – 4.2 V</div>
        </article>
      </div>

      <div class="actions">
        <button id="btnRefresh" class="btn" onclick="cargarDatos()">Actualizar</button>
      </div>
      <div id="status" class="status">Cargando datos...</div>
    </div>

    <script>
      const CFG = {
        temp: { min: 15, max: 25, unit: " °C", decimals: 1 },
        hum: { min: 30, max: 65, unit: " %", decimals: 1 },
        batt: { min: 3.6, max: 4.2 },
      };

      function toNumber(v) {
        if (v === null || v === undefined || v === "") return NaN;
        return parseFloat(String(v).replace(",", "."));
      }

      function clamp01(x) {
        return Math.max(0, Math.min(1, x));
      }

      function levelColor(frac, outOfRange) {
        if (outOfRange) return "var(--bad)";
        return "var(--ok)";
      }

      function setGauge(id, textId, cfg, raw) {
        const val = toNumber(raw);
        const arc = document.getElementById(id);
        const txt = document.getElementById(textId);
        if (isNaN(val)) {
          txt.textContent = "—";
          arc.setAttribute("stroke-dashoffset", 100);
          return;
        }
        const frac = clamp01((val - cfg.min) / (cfg.max - cfg.min));
        const out = val < cfg.min || val > cfg.max;
        arc.setAttribute("stroke-dashoffset", 100 - frac * 100);
        arc.style.stroke = levelColor(frac, out);
        txt.textContent = val.toFixed(cfg.decimals) + cfg.unit;
      }

      function setBattery(raw) {
        const val = toNumber(raw);
        const fill = document.getElementById("batt-fill");
        const txt = document.getElementById("t-batt");
        const pctEl = document.getElementById("t-batt-pct");
        if (isNaN(val)) {
          fill.setAttribute("width", 0);
          txt.textContent = "—";
          return;
        }
        const frac = clamp01((val - CFG.batt.min) / (CFG.batt.max - CFG.batt.min));
        fill.setAttribute("width", Math.max(frac * 88, frac > 0 ? 3 : 0));
        fill.setAttribute("fill", frac < 0.2 ? "#dc2626" : frac < 0.5 ? "#f59e0b" : "#16a34a");
        txt.textContent = val.toFixed(2) + " V";
        pctEl.textContent = Math.round(frac * 100) + " %  (3.6 V – 4.2 V)";
      }

      function render(data) {
        const status = document.getElementById("status");
        if (!Array.isArray(data) || data.length === 0) {
          status.textContent = "No se encontraron datos.";
          return;
        }
        const byCol = {};
        data.forEach((d) => (byCol[d.columna] = d.valor));

        document.getElementById("fecha").textContent =
          byCol.A !== "" && byCol.A != null ? byCol.A : "—";
        setGauge("g-temp", "t-temp", CFG.temp, byCol.B);
        setGauge("g-hum", "t-hum", CFG.hum, byCol.C);
        setBattery(byCol.D);

        status.textContent = "Consultado: " + new Date().toLocaleString();
      }

      function cargarDatos() {
        const btn = document.getElementById("btnRefresh");
        const status = document.getElementById("status");
        status.classList.remove("error");
        status.textContent = "Cargando datos...";
        btn.disabled = true;

        google.script.run
          .withSuccessHandler(function (res) {
            btn.disabled = false;
            render(res);
          })
          .withFailureHandler(function (err) {
            btn.disabled = false;
            status.classList.add("error");
            status.textContent = "Error: " + (err && err.message ? err.message : err);
          })
          .getUltimosDatos();
      }

      window.addEventListener("load", cargarDatos);
    </script>
  </body>
</html>
