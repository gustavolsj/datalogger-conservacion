<!doctype html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Últimos datos</title>
    <style>
      :root {
        --bg: #17181b;
        --card: #212328;
        --border: #2f3238;
        --text: #e6e8eb;
        --muted: #a3a8b0;
        --track: #17181b;
        --green: #23c48e;
        --red: #e8445a;
        --amber: #f5a623;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          "DIN Alternate", "Bahnschrift", "Segoe UI", Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .topbar {
        background: var(--green);
        color: #0e1a16;
        padding: 14px 12px;
        text-align: center;
        position: sticky;
        top: 0;
        z-index: 2;
      }
      .fecha {
        font-size: clamp(1.15rem, 5vw, 1.9rem);
        font-weight: 500;
        letter-spacing: 0.03em;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: clamp(8px, 2.5vw, 16px);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: clamp(6px, 1.5vw, 12px);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 12px 14px 8px;
      }
      .card-head {
        display: flex;
        justify-content: center;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        color: var(--text);
      }
      .card-head .pin {
        color: var(--muted);
      }
      svg {
        width: 100%;
        height: auto;
        display: block;
        max-width: 340px;
        margin: 0 auto;
      }
      .arc {
        fill: none;
        stroke-width: 15;
        stroke-linecap: round;
      }
      .arc-track {
        stroke: var(--track);
      }
      .arc-fill {
        stroke: var(--green);
        transition:
          stroke-dashoffset 0.6s ease,
          stroke 0.3s;
      }
      .gauge-value {
        font-size: 38px;
        font-weight: 300;
        fill: var(--green);
        transition: fill 0.3s;
      }
      .gauge-unit {
        font-size: 16px;
      }
      .gauge-limit {
        font-size: 12px;
        fill: var(--muted);
      }
      .batt-wrap {
        padding: 10px 0 6px;
        text-align: center;
      }
      .batt-wrap svg {
        max-width: 200px;
      }
      .batt-value {
        font-size: 2.4rem;
        font-weight: 300;
        color: var(--green);
        margin-top: 4px;
        transition: color 0.3s;
      }
      .batt-sub {
        color: var(--muted);
        font-size: 0.85rem;
        margin-top: 2px;
      }
      .actions {
        margin-top: 12px;
      }
      .btn {
        width: 100%;
        border: 0;
        border-radius: 999px;
        background: var(--green);
        color: #0e1a16;
        padding: 11px 18px;
        font-family: inherit;
        font-size: 1.1rem;
        cursor: pointer;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status {
        margin-top: 10px;
        font-size: 0.8rem;
        color: var(--muted);
        text-align: center;
      }
      .status.error {
        color: var(--red);
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div id="fecha" class="fecha">—</div>
    </div>

    <div class="container">
      <div class="grid">
        <article class="card">
          <div class="card-head">
            <span id="h-temp">Temperatura</span>
          </div>
          <svg viewBox="0 0 200 180" role="img" aria-label="Temperatura">
            <path
              class="arc arc-track"
              d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57"
              pathLength="100"
            />
            <path
              id="g-temp"
              class="arc arc-fill"
              d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57"
              pathLength="100"
              stroke-dasharray="100"
              stroke-dashoffset="100"
            />
            <text
              id="t-temp"
              class="gauge-value"
              x="100"
              y="115"
              text-anchor="middle"
            >
              —
            </text>
            <text class="gauge-limit" x="62" y="168" text-anchor="middle">
              15
            </text>
            <text class="gauge-limit" x="138" y="168" text-anchor="middle">
              25
            </text>
          </svg>
        </article>

        <article class="card">
          <div class="card-head">
            <span id="h-hum">Humedad relativa</span>
          </div>
          <svg viewBox="0 0 200 180" role="img" aria-label="Humedad relativa">
            <path
              class="arc arc-track"
              d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57"
              pathLength="100"
            />
            <path
              id="g-hum"
              class="arc arc-fill"
              d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57"
              pathLength="100"
              stroke-dasharray="100"
              stroke-dashoffset="100"
            />
            <text
              id="t-hum"
              class="gauge-value"
              x="100"
              y="115"
              text-anchor="middle"
            >
              —
            </text>
            <text class="gauge-limit" x="62" y="168" text-anchor="middle">
              30
            </text>
            <text class="gauge-limit" x="138" y="168" text-anchor="middle">
              65
            </text>
          </svg>
        </article>

        <article class="card">
          <div class="card-head">
            <span>Batería</span>
          </div>
          <div class="batt-wrap">
            <svg viewBox="0 0 120 60" role="img" aria-label="Batería">
              <rect
                x="4"
                y="8"
                width="100"
                height="44"
                rx="6"
                fill="none"
                stroke="#a3a8b0"
                stroke-width="3"
              />
              <rect
                x="106"
                y="22"
                width="8"
                height="16"
                rx="2"
                fill="#a3a8b0"
              />
              <rect
                id="batt-fill"
                x="10"
                y="14"
                width="0"
                height="32"
                rx="3"
                fill="#23c48e"
              />
            </svg>
            <div id="t-batt" class="batt-value">—</div>
            <div id="t-batt-pct" class="batt-sub">3.6 V – 4.2 V</div>
          </div>
        </article>
      </div>

      <div class="actions">
        <button id="btnRefresh" class="btn" onclick="cargarDatos()">
          Actualizar
        </button>
      </div>
      <div id="status" class="status">Cargando datos...</div>
    </div>

    <script>
      const CFG = {
        temp: { min: 15, max: 25, unit: " °C", decimals: 1, color: "#f74747" },
        hum: { min: 30, max: 65, unit: " %", decimals: 1, color: "#699ef7" },
        batt: { min: 3.6, max: 4.2 },
      };
      const GREEN = "#23c48e",
        RED = "#e8445a",
        AMBER = "#f5a623";

      function toNumber(v) {
        if (v === null || v === undefined || v === "") return NaN;
        return parseFloat(String(v).replace(",", "."));
      }
      function clamp01(x) {
        return Math.max(0, Math.min(1, x));
      }

      function setGauge(key, raw) {
        const cfg = CFG[key];
        const val = toNumber(raw);
        const arc = document.getElementById("g-" + key);
        const txt = document.getElementById("t-" + key);
        arc.style.stroke = cfg.color;
        txt.style.fill = cfg.color;
        if (isNaN(val)) {
          txt.textContent = "—";
          arc.setAttribute("stroke-dashoffset", 100);
          return;
        }
        const frac = clamp01((val - cfg.min) / (cfg.max - cfg.min));
        arc.setAttribute("stroke-dashoffset", 100 - frac * 100);
        txt.textContent = val.toFixed(cfg.decimals);
        const u = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "tspan",
        );
        u.setAttribute("class", "gauge-unit");
        u.textContent = cfg.unit;
        txt.appendChild(u);
      }

      function setBattery(raw) {
        const val = toNumber(raw);
        const fill = document.getElementById("batt-fill");
        const txt = document.getElementById("t-batt");
        const pctEl = document.getElementById("t-batt-pct");
        if (isNaN(val)) {
          fill.setAttribute("width", 0);
          txt.textContent = "—";
          return;
        }
        const frac = clamp01(
          (val - CFG.batt.min) / (CFG.batt.max - CFG.batt.min),
        );
        const color = frac < 0.2 ? RED : frac < 0.5 ? AMBER : GREEN;
        fill.setAttribute("width", Math.max(frac * 88, frac > 0 ? 3 : 0));
        fill.setAttribute("fill", color);
        txt.style.color = color;
        txt.textContent = val.toFixed(2) + " V";
        pctEl.textContent = Math.round(frac * 100) + " %  (3.6 V – 4.2 V)";
      }

      function render(data) {
        const status = document.getElementById("status");
        if (!Array.isArray(data) || data.length === 0) {
          status.textContent = "No se encontraron datos.";
          return;
        }
        const byCol = {};
        data.forEach((d) => (byCol[d.columna] = d.valor));
        document.getElementById("fecha").textContent =
          byCol.A !== "" && byCol.A != null ? byCol.A : "—";
        setGauge("temp", byCol.B);
        setGauge("hum", byCol.C);
        setBattery(byCol.D);
        status.textContent = "";
      }

      function cargarDatos() {
        const btn = document.getElementById("btnRefresh");
        const status = document.getElementById("status");
        status.classList.remove("error");
        status.textContent = "Cargando datos...";
        btn.disabled = true;
        google.script.run
          .withSuccessHandler(function (res) {
            btn.disabled = false;
            render(res);
          })
          .withFailureHandler(function (err) {
            btn.disabled = false;
            status.classList.add("error");
            status.textContent =
              "Error: " + (err && err.message ? err.message : err);
          })
          .getUltimosDatos();
      }

      // ===== MODO PREVIEW: comenta o borra este bloque en producción =====
      window.addEventListener("load", function () {
        render([
          { columna: "A", valor: "21/10/2026, 17:40:00" },
          { columna: "B", valor: 21.5 },
          { columna: "C", valor: 48.3 },
          { columna: "D", valor: 3.75 },
        ]);
      });
      // ===== FIN MODO PREVIEW =====

      // ===== PRODUCCIÓN: descomenta esta línea y comenta el bloque PREVIEW =====
      //window.addEventListener("load", cargarDatos);
    </script>
  </body>
</html>
